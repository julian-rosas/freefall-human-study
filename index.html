<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Estudio de predicción física
  </title>


  <!-- jsPsych -->

  <script
    src="https://unpkg.com/jspsych@8.3.0">
  </script>


  <!-- Plugins -->

  <script
    src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0">
  </script>

  <script
    src="https://unpkg.com/@jspsych/plugin-survey-text@2.1.1">
  </script>

  <script
    src="https://unpkg.com/@jspsych/plugin-survey-likert@2.2.0">
  </script>

  <script
    src="https://unpkg.com/@jspsych/plugin-sketchpad@2.1.0">
  </script>


  <!-- CSS de jsPsych -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css"
  >


  <!-- CSS del estudio -->

  <link
    rel="stylesheet"
    href="style.css?v=all24-v3"
  >

</head>


<body>


  <!--
    Iframe invisible utilizado para recibir
    la confirmación de Google Apps Script.
  -->

  <iframe
    id="save_target"
    name="save_target"
    style="display:none;">
  </iframe>


  <!--
    Formulario invisible que envía
    el JSON completo a Google Apps Script.
  -->

  <form
    id="save_form"
    method="POST"
    target="save_target"
    style="display:none;"
  >

    <input
      type="hidden"
      id="save_payload"
      name="payload"
    >

    <input
      type="hidden"
      id="save_nonce"
      name="nonce"
    >

  </form>


  <!-- Estudio -->

  <script
    src="app.js?v=all24-v3">
  </script>


</body>

</html>
